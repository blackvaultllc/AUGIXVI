<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title></title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  #glholder{position:fixed;inset:0}
  #glholder canvas{display:block}
  #cube2d{position:fixed;inset:0;width:100%;height:100%;display:block}
  #answer{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;width:min(430px,86vw);padding:11px 14px;background:rgba(0,0,0,.78);border:1px solid #77612c;border-radius:8px;color:#f4ead0;font:15px ui-monospace,Menlo,Consolas,monospace;text-align:center;outline:none}
  #answer:focus{border-color:#d4af37}
</style>
</head>
<body>
<!-- HEXO, stripped to the cube (owner order 2026-11-28): everything
     except the cube and one answer box is gone — no hints, no words.
     The cube is locked: it spins in space and answers no hand.
     The document holds no answer check — its old answer games (the
     word vault, the element hunt) went out with everything else —
     so the box stands as the single input and nothing is checked.
     Nothing was invented to fill the silence. -->
<canvas id="cube2d"></canvas>
<div id="glholder"></div>
<input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer" />
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  // The artifact's resting state: chaos at its floor (0.2), the
  // slowest spin — the speed the cube idled at when left alone.
  var chaos=0.2;

  /* ---------- THREE cube ---------- */
  try{
    if(!window.THREE) throw new Error('no three');
    var holder=$('glholder');
    var scene=new THREE.Scene();
    var camera=new THREE.PerspectiveCamera(42, 2, 0.1, 100); camera.position.set(6.6,5.3,8.1); camera.lookAt(0,0,0);
    var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.domElement.className='webgl'; holder.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff,0.75));
    var key=new THREE.DirectionalLight(0xffffff,0.9); key.position.set(4,6,5); scene.add(key);
    var rim=new THREE.DirectionalLight(0xffb000,0.6); rim.position.set(-5,-3,-4); scene.add(rim);

    var reducedMotion=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Black-and-gold boxes: every cubie face is black with a gold trim.
    // The 0 / 1 digits themselves are each a different bright colour.
    var digitCols=[0xffd700,0x2ee6ff,0x39ff8e,0xff5a3c,0xc084fc,0xffffff,0xff6ec7,0x4da6ff,0xffb000,0xa3e635];
    function makeDigitTexture(col,digit){
      var c=document.createElement('canvas'); c.width=c.height=128;
      var g=c.getContext('2d');
      g.fillStyle='#0a0a08'; g.fillRect(0,0,128,128);
      g.fillStyle='#11110c'; g.fillRect(10,10,108,108);
      g.strokeStyle='#d4af37'; g.lineWidth=9; g.strokeRect(5,5,118,118);
      g.strokeStyle='rgba(255,215,0,0.35)'; g.lineWidth=2; g.strokeRect(14,14,100,100);
      g.fillStyle='#'+('000000'+col.toString(16)).slice(-6); g.font='700 76px monospace'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(digit,64,70);
      var tex=new THREE.CanvasTexture(c); tex.anisotropy=4; return tex;
    }
    var allDigitMats=[];
    digitCols.forEach(function(col){ ['0','1'].forEach(function(d){ var m=new THREE.MeshStandardMaterial({map:makeDigitTexture(col,d),roughness:0.32,metalness:0.28}); m.userData.glyph=d; allDigitMats.push(m); }); });
    // the whole alphabet + Roman numerals live in the cube too — same black face, gold trim
    function makeGlyphTexture(txt,col){
      var c=document.createElement('canvas'); c.width=c.height=128;
      var g=c.getContext('2d');
      g.fillStyle='#0a0a08'; g.fillRect(0,0,128,128);
      g.fillStyle='#11110c'; g.fillRect(10,10,108,108);
      g.strokeStyle='#d4af37'; g.lineWidth=9; g.strokeRect(5,5,118,118);
      g.strokeStyle='rgba(255,215,0,0.35)'; g.lineWidth=2; g.strokeRect(14,14,100,100);
      g.fillStyle='#'+('000000'+col.toString(16)).slice(-6);
      g.font='700 '+(txt.length<=1?76:txt.length===2?54:txt.length===3?42:34)+'px monospace'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(txt,64,70);
      var tex=new THREE.CanvasTexture(c); tex.anisotropy=4; return tex;
    }
    var letterMats={};
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(ch,i){ var m=new THREE.MeshStandardMaterial({map:makeGlyphTexture(ch,digitCols[i%digitCols.length]),roughness:0.32,metalness:0.28}); m.userData.glyph=ch; letterMats[ch]=m; });
    var ROMAN_LIST=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
    var romanMats=ROMAN_LIST.map(function(r,i){ var m=new THREE.MeshStandardMaterial({map:makeGlyphTexture(r,digitCols[(i+3)%digitCols.length]),roughness:0.32,metalness:0.28}); m.userData.glyph=r; m.userData.roman=true; return m; });
    var letterMatList=Object.keys(letterMats).map(function(k){ return letterMats[k]; });
    function randomDigitMat(){
      var r=Math.random();
      if(r<0.68) return allDigitMats[Math.floor(Math.random()*allDigitMats.length)];
      if(r<0.88) return letterMatList[Math.floor(Math.random()*letterMatList.length)];
      return romanMats[Math.floor(Math.random()*romanMats.length)];
    }
    var cubeGroup=new THREE.Group(); scene.add(cubeGroup);
    var pivot=new THREE.Group(); cubeGroup.add(pivot);
    var cubies=[];
    var GRID=11, STEP=0.30;
    var geo=new THREE.BoxGeometry(0.27,0.27,0.27);
    function cubieMats(){ return [randomDigitMat(),randomDigitMat(),randomDigitMat(),randomDigitMat(),randomDigitMat(),randomDigitMat()]; }
    var HALF=(GRID-1)/2;
    for(var ix=0;ix<GRID;ix++) for(var iy=0;iy<GRID;iy++) for(var iz=0;iz<GRID;iz++){
      var mesh=new THREE.Mesh(geo,cubieMats()); mesh.position.set((ix-HALF)*STEP,(iy-HALF)*STEP,(iz-HALF)*STEP);
      cubeGroup.add(mesh); cubies.push(mesh);
    }
    // scatter the hunt into the cube: TIME thrown to far-apart corners, the whole alphabet sprinkled once each, Roman numerals everywhere
    function seedFace(mesh,mat){ var nm=mesh.material.slice(); nm[Math.floor(Math.random()*6)]=mat; mesh.material=nm; }
    var timeSpots=[[0,0,0],[GRID-1,GRID-1,GRID-1],[GRID-1,0,GRID-1],[0,GRID-1,0]];
    'TIME'.split('').forEach(function(ch,k){ var s=timeSpots[k]; seedFace(cubies[(s[0]*GRID+s[1])*GRID+s[2]], letterMats[ch]); });
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(ch){ seedFace(cubies[Math.floor(Math.random()*cubies.length)], letterMats[ch]); });
    for(var rn2=0;rn2<40;rn2++){ seedFace(cubies[Math.floor(Math.random()*cubies.length)], romanMats[rn2%romanMats.length]); }
    var wire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(3.38,3.38,3.38)), new THREE.LineBasicMaterial({color:0xd4af37,transparent:true,opacity:0.5}));
    scene.add(wire);
    // particles bashing inside
    var pGeo=new THREE.BufferGeometry(); var N=620; var posArr=new Float32Array(N*3); var vel=[];
    for(var i=0;i<N;i++){ posArr[i*3]=(Math.random()-0.5)*3; posArr[i*3+1]=(Math.random()-0.5)*3; posArr[i*3+2]=(Math.random()-0.5)*3; vel.push(new THREE.Vector3((Math.random()-0.5)*0.11,(Math.random()-0.5)*0.11,(Math.random()-0.5)*0.11)); }
    pGeo.setAttribute('position', new THREE.BufferAttribute(posArr,3));
    var points=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xffb000,size:0.07})); scene.add(points);
    var burst=0;
    window.__hexoBurst=function(){ burst=1; };
    var twisting=null;
    function snapCubie(c){
      c.position.set(Math.round(c.position.x/STEP)*STEP,Math.round(c.position.y/STEP)*STEP,Math.round(c.position.z/STEP)*STEP);
      var e=new THREE.Euler().setFromQuaternion(c.quaternion,'XYZ');
      var q=Math.PI/2;
      c.rotation.set(Math.round(e.x/q)*q,Math.round(e.y/q)*q,Math.round(e.z/q)*q);
    }
    function twist(){
      if(twisting) return;
      var axis=['x','y','z'][Math.floor(Math.random()*3)]; var layerVal=Math.floor(Math.random()*GRID)-HALF;
      pivot.rotation.set(0,0,0); pivot.updateMatrixWorld(true);
      var slice=cubies.filter(function(c){ return Math.round(c.position[axis]/STEP)===layerVal; });
      slice.forEach(function(c){ pivot.attach(c); });
      twisting={axis:axis,slice:slice,angle:0,target:Math.PI/2,dir:Math.random()>0.5?1:-1};
    }
    function finishTwist(){
      pivot.updateMatrixWorld(true);
      twisting.slice.forEach(function(c){ cubeGroup.attach(c); snapCubie(c); });
      pivot.rotation.set(0,0,0);
      twisting=null;
    }
    setInterval(function(){ if(Math.random()>(reducedMotion?0.85:0.05)) twist(); },reducedMotion?3200:420);
    // LOCKED (owner order 2026-11-28): no drag. The cube turns on
    // its own; it does not answer a visitor's hand.
    // LOCKED: no tap-to-collect. The letters ride the faces to be
    // seen, not taken.
    function resize(){ var w=holder.clientWidth||window.innerWidth; var h=holder.clientHeight||window.innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
    resize(); window.addEventListener('resize',resize);
    cubeGroup.rotation.set(0.4,0.6,0);
    var clock=0, lastFlip=0;
    var spinMul=reducedMotion?0.18:1;
    (function animate(){
      requestAnimationFrame(animate);
      clock+=0.016;
      cubeGroup.rotation.y+=0.038*chaos*spinMul;
        cubeGroup.rotation.x+=0.019*chaos*spinMul;
        cubeGroup.rotation.z+=0.007*chaos*spinMul + Math.sin(clock*2.4)*0.004*chaos*spinMul;
        cubeGroup.position.y=Math.sin(clock*5.5)*0.14*spinMul;
        cubeGroup.position.x=Math.sin(clock*3.7)*0.06*spinMul;
        var pulse=1+Math.sin(clock*7.2)*0.035*spinMul+(burst>0?burst*0.09:0);
        cubeGroup.scale.setScalar(pulse);
      wire.rotation.copy(cubeGroup.rotation);
      wire.position.copy(cubeGroup.position);
      wire.scale.copy(cubeGroup.scale);
      // digits keep flipping across the faces — super fast now, chaos speed, each flip a new colour
      if(!reducedMotion && clock-lastFlip>0.045){
        lastFlip=clock;
        for(var fi=0;fi<220;fi++){
          var m=cubies[Math.floor(Math.random()*cubies.length)];
          var nm=m.material.slice(); var f=Math.floor(Math.random()*6);
          nm[f]=randomDigitMat(); m.material=nm;
        }
      }
      if(twisting){
        var step=(reducedMotion?0.05:0.28)*twisting.dir; twisting.angle+=Math.abs(step);
        pivot.rotation[twisting.axis]+=step;
        if(twisting.angle>=twisting.target){
          pivot.rotation[twisting.axis]=twisting.target*twisting.dir;
          finishTwist();
        }
      }
      var arr=pGeo.attributes.position.array;
      for(var j=0;j<N;j++){ var v=vel[j]; if(burst>0){ v.multiplyScalar(1.06); } arr[j*3]+=v.x*chaos*(1+burst*2); arr[j*3+1]+=v.y*chaos*(1+burst*2); arr[j*3+2]+=v.z*chaos*(1+burst*2); ['x','y','z'].forEach(function(ax,k){ if(Math.abs(arr[j*3+k])>1.55){ v[ax]*=-1; arr[j*3+k]=Math.sign(arr[j*3+k])*1.55; } }); }
      if(burst>0) burst=Math.max(0,burst-0.02);
      pGeo.attributes.position.needsUpdate=true;
      points.rotation.y-=0.002;
      renderer.render(scene,camera);
    })();
    var c2=document.getElementById('cube2d'); if(c2) c2.style.display='none';
  }catch(e){ var h=document.getElementById('glholder'); if(h) h.style.display='none'; }


})();
</script>
<script>
(function(){
  "use strict";
  var cv=document.getElementById('cube2d'); if(!cv) return;
  var ctx=cv.getContext('2d');
  window.__hexoLayer=window.__hexoLayer||'binary';
  var digitPalette=['#ffd700','#2ee6ff','#39ff8e','#ff5a3c','#c084fc','#ffffff','#ff6ec7','#4da6ff','#ffb000','#a3e635'];
  var palettes={
    binary:{faces:['#0a0a08','#14140e','#080807'],labels:['0','1','0','1','1','0','1','0','1'],edge:'#d4af37'},
    hex:{faces:['#0a0a08','#14140e','#080807'],labels:['0','F','A','9','C','3','E','7','D'],edge:'#d4af37'},
    hexo:{faces:['#0a0a08','#14140e','#080807'],labels:['H','E','X','O','X','H','O','E','X'],edge:'#d4af37'},
    knowledge:{faces:['#0a0a08','#14140e','#080807'],labels:['H','He','Li','Be','B','C','N','O','F'],edge:'#d4af37'}
  };
  var reduced2=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W,H,t=0,spin=0,twistPulse=0;
  var parts=[]; for(var i=0;i<240;i++) parts.push({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.009,vy:(Math.random()-0.5)*0.009,c:Math.random()>0.5?'#d4af37':'#2ee6ff'});
  // stable per-cell digits for the 11x11 faces — they flip over time but the grid never moves
  var cellBits=[]; for(var bi=0;bi<363;bi++) cellBits.push(Math.random()>0.5?'1':'0');
  // the hunt, scattered across the three faces: TIME far apart, the whole alphabet, Roman numerals
  var cellGlyphs={}, cellRomans={};
  cellGlyphs[0]='T'; cellGlyphs[121]='I'; cellGlyphs[242]='M'; cellGlyphs[60]='E';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(ch){ var idx=Math.floor(Math.random()*363); if(!cellGlyphs[idx]) cellGlyphs[idx]=ch; });
  var ROMAN2D=['I','II','III','IV','V','VI','VII','VIII','IX','X','XII','XV','XX'];
  for(var rr=0;rr<28;rr++){ var ri=Math.floor(Math.random()*363); if(!cellGlyphs[ri]){ cellGlyphs[ri]=ROMAN2D[rr%ROMAN2D.length]; cellRomans[ri]=true; } }
  var cellCenters=[];
  // LOCKED (owner order 2026-11-28): the 2D cube takes no clicks.
  // It spins; that is all.
  function size(){ var r=cv.parentElement.getBoundingClientRect(); W=cv.width=r.width; H=cv.height=r.height; }
  size(); window.addEventListener('resize',size);
  function quad(p1,p2,p3,p4,fill,edge){
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.lineTo(p3[0],p3[1]); ctx.lineTo(p4[0],p4[1]); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=edge; ctx.lineWidth=1.4; ctx.stroke();
  }
  function draw(){
    requestAnimationFrame(draw);
    if(cv.style.display==='none') return;
    var frozen2=!!window.__cubeFrozen;
    if(!frozen2){ t+=0.048; if(twistPulse>0) twistPulse-=0.03; }
    spin=Math.sin(t*1.8)*0.42;
    // flip digits super fast — chaos speed, wild faces, steady grid, colours keep shifting too
    if(!reduced2 && !frozen2){ for(var fk=0;fk<90;fk++){ var fb=Math.floor(Math.random()*cellBits.length); cellBits[fb]=cellBits[fb]==='1'?'0':'1'; } }
    ctx.clearRect(0,0,W,H);
    var pal=palettes[window.__hexoLayer]||palettes.binary;
    var s=Math.min(W,H)*0.165*(1+twistPulse*0.09+Math.sin(t*4)*0.03);
    var bob=reduced2?0:Math.sin(t*6.5)*14;
    var cx=W/2, cy=H/2+bob;
    // fixed isometric axes — never skewed, so the 5x5 grid stays perfectly even
    var ax=[0.866, 0.5], az=[-0.866, 0.5], ay=[0,-1];
    function proj(x,y,z){ return [cx + (x*ax[0]+z*az[0]+y*ay[0])*s, cy + (x*ax[1]+z*az[1]+y*ay[1])*s]; }
    // three visible faces of the big cube, each an even 11x11 sticker grid (1,331 cubies in 3D)
    var GN=11;
    var faces=[
      {pts:function(u,v){ return [-1+2*u, 1, -1+2*v]; }},        // top (y=+1)
      {pts:function(u,v){ return [-1+2*u, 1-2*v, 1]; }},          // left-front (z=+1)
      {pts:function(u,v){ return [1, 1-2*v, 1-2*u]; }}            // right-front (x=+1)
    ];
    faces.forEach(function(f,fi){
      for(var r=0;r<GN;r++) for(var c=0;c<GN;c++){
        var idx=fi*GN*GN+r*GN+c;
        var u0=c/GN,v0=r/GN,u1=(c+1)/GN,v1=(r+1)/GN,g=0.012;
        var P=function(u,v){ var q=f.pts(u,v); return proj(q[0],q[1],q[2]); };
        var pts=[P(u0+g,v0+g),P(u1-g,v0+g),P(u1-g,v1-g),P(u0+g,v1-g)];
        quad(pts[0],pts[1],pts[2],pts[3], pal.faces[idx%3], pal.edge);
        var mid=P((u0+u1)/2,(v0+v1)/2);
        var huntG=cellGlyphs[idx];
        var label = huntG ? huntG : (window.__hexoLayer==='binary' ? cellBits[idx] : pal.labels[idx%pal.labels.length]);
        cellCenters[idx]={x:mid[0], y:mid[1], g: huntG || cellBits[idx], roman: !!cellRomans[idx]};
        ctx.fillStyle= huntG ? '#ffd700' : digitPalette[(idx+Math.floor(t*3))%digitPalette.length];
        ctx.font='700 '+Math.max(5, s*0.072*(label.length>2?0.55:label.length===2?0.78:1))+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(label, mid[0], mid[1]);
      }
    });
    // particles bashing inside / around — chaos speed
    var pSpeed=frozen2?0:(reduced2?1.5:14);
    parts.forEach(function(p){ p.x+=p.vx*pSpeed; p.y+=p.vy*pSpeed; if(p.x<0||p.x>1)p.vx*=-1; if(p.y<0||p.y>1)p.vy*=-1; ctx.fillStyle=p.c; ctx.globalAlpha=0.8; ctx.beginPath(); ctx.arc(p.x*W,p.y*H,2.2,0,7); ctx.fill(); ctx.globalAlpha=1; });
  }
  draw();
})();

</script>
</body>
</html>
